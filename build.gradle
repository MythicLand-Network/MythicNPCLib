plugins {
    id 'java-library'
}

group = 'cn.mythicland'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/repository/public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
    maven { url = 'https://repo.dmulloy2.net/nexus/repository/public/' }
}

apply from: rootProject.file('gradle/spigot-1.8.8.gradle')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation 'it.unimi.dsi:fastutil:8.5.13'
    compileOnly files(spigot188Jar)
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation files(spigot188Jar)
    testImplementation 'net.dmulloy2:ProtocolLib:5.4.0'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
}

tasks.named('compileJava') {
    dependsOn tasks.named('prepareSpigot188')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('prepareSpigot188')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion.set('')
}

tasks.named('jar') {
    archiveFileName = 'MythicNPCLib.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicNPCLib-sources.jar'
}
