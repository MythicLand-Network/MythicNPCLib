import java.nio.channels.FileChannel
import java.nio.channels.OverlappingFileLockException
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.nio.file.StandardOpenOption
import java.util.concurrent.TimeUnit
import java.util.zip.ZipFile

def spigotDirectory = new File(gradle.gradleUserHomeDir, 'caches/mythicland/spigot-1.8.8')
ext.spigot188Jar = new File(spigotDirectory, 'spigot-1.8.8.jar')
def spigot112Directory = new File(gradle.gradleUserHomeDir, 'caches/mythicland/spigot-1.12.2')
ext.spigot112Jar = new File(spigot112Directory, 'spigot-1.12.2.jar')

tasks.register('prepareSpigot112') {
    dependsOn tasks.named('prepareSpigot188')
    outputs.file(spigot112Jar)
    outputs.upToDateWhen { isSpigotVersion(spigot112Jar, 'v1_12_R1') }
    onlyIf { !isSpigotVersion(spigot112Jar, 'v1_12_R1') }
    doLast {
        spigot112Directory.mkdirs()
        File localJar = new File(System.getProperty('user.home'), '.m2/repository/org/spigotmc/spigot/1.12.2-R0.1-SNAPSHOT/spigot-1.12.2-R0.1-SNAPSHOT.jar')
        if (isSpigotVersion(localJar, 'v1_12_R1')) {
            Files.copy(localJar.toPath(), spigot112Jar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        } else {
            File buildTools = new File(spigotDirectory, 'BuildTools.jar')
            if (!isZip(buildTools)) {
                download('https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar', buildTools)
            }
            boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
            File javaExecutable = resolveJava8(windows, spigotDirectory)
            if (javaExecutable == null) throw new GradleException('BuildTools requires Java 8 for Spigot 1.12.2')
            runBuildTools(javaExecutable, buildTools, spigot112Directory, windows, '1.12.2')
        }
        if (!isSpigotVersion(spigot112Jar, 'v1_12_R1')) throw new GradleException('BuildTools did not produce a valid Spigot 1.12.2 jar')
    }
}

tasks.register('prepareSpigot188') {
    outputs.file(spigot188Jar)
    outputs.upToDateWhen { isSpigot188(spigot188Jar) }
    onlyIf { !isSpigot188(spigot188Jar) }
    doLast {
        File directory = spigotDirectory
        directory.mkdirs()
        File lockFile = new File(directory, 'prepare.lock')
        FileChannel.open(
                lockFile.toPath(),
                StandardOpenOption.CREATE,
                StandardOpenOption.WRITE
        ).withCloseable { channel ->
            def lock = null
            while (lock == null) {
                try {
                    lock = channel.tryLock()
                } catch (OverlappingFileLockException ignored) {
                }
                if (lock == null) Thread.sleep(200)
            }
            lock.withCloseable {
                File jar = spigot188Jar
                if (isSpigot188(jar)) return

                File buildTools = new File(directory, 'BuildTools.jar')
                if (!isZip(buildTools)) {
                    download(
                            'https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar',
                            buildTools
                    )
                }

                boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
                File javaExecutable = resolveJava8(windows, directory)
                if (javaExecutable == null) {
                    throw new GradleException('BuildTools requires Java 8. Set JAVA8_HOME or provide a Java 8 runtime in the Spigot cache.')
                }

                runBuildTools(javaExecutable, buildTools, directory, windows, '1.8.8')

                if (!jar.isFile() || !isSpigot188(jar)) {
                    throw new GradleException('BuildTools did not produce a valid Spigot 1.8.8 jar')
                }
            }
        }
    }
}

private File resolveJava8(boolean windows, File directory) {
    String configured = System.getenv('JAVA8_HOME')
    if (configured == null) {
        configured = System.getenv().find { key, ignored -> key.startsWith('JAVA_HOME_8') }?.value
    }
    List<File> candidates = []
    if (configured != null) candidates << new File(configured, 'bin/java' + (windows ? '.exe' : ''))
    if (windows) {
        candidates.addAll(fileTree('C:/Program Files/Java').matching { include 'jdk8*/bin/java.exe' }.files)
    } else {
        candidates.addAll(fileTree('/usr/lib/jvm').matching { include '**/bin/java' }.files.findAll {
            it.absolutePath.contains('8')
        })
    }
    candidates.addAll(fileTree(new File(directory, 'jdk8')).matching {
        include windows ? '**/java.exe' : '**/bin/java'
    }.files)
    File javaExecutable = candidates.find { it.isFile() && javaMajorVersion(it) == 8 }
    if (javaExecutable != null) return javaExecutable

    File jdkDirectory = new File(directory, 'jdk8')
    File archive = new File(directory, windows ? 'jdk8.zip' : 'jdk8.tar.gz')
    String platform = windows ? 'windows' : (System.getProperty('os.name').toLowerCase().contains('mac') ? 'mac' : 'linux')
    download("https://api.adoptium.net/v3/binary/latest/8/ga/${platform}/x64/jdk/hotspot/normal/eclipse", archive)
    if (windows) {
        copy { from zipTree(archive); into jdkDirectory }
    } else {
        copy { from tarTree(resources.gzip(archive)); into jdkDirectory }
    }
    return fileTree(jdkDirectory).matching {
        include windows ? '**/java.exe' : '**/bin/java'
    }.files.find { it.name == (windows ? 'java.exe' : 'java') && javaMajorVersion(it) == 8 }
}

private void download(String url, File target) {
    File temporary = new File(target.parentFile, "${target.name}.tmp")
    if (temporary.isFile() && !temporary.delete()) {
        throw new GradleException("Unable to replace temporary download: ${temporary}")
    }
    URLConnection connection = new URI(url).toURL().openConnection()
    connection.connectTimeout = 30_000
    connection.readTimeout = 120_000
    connection.inputStream.withCloseable { input ->
        temporary.withOutputStream { output -> output << input }
    }
    if (temporary.length() == 0L) {
        temporary.delete()
        throw new GradleException("Downloaded file is empty: ${url}")
    }
    Files.move(
            temporary.toPath(),
            target.toPath(),
            StandardCopyOption.REPLACE_EXISTING
    )
}

private boolean isZip(File file) {
    if (!file.isFile()) return false
    try {
        new ZipFile(file).close()
        return true
    } catch (IOException ignored) {
        return false
    }
}

private int javaMajorVersion(File executable) {
    Process process
    try {
        process = new ProcessBuilder(executable.absolutePath, '-version')
                .redirectErrorStream(true)
                .start()
        if (!process.waitFor(10, TimeUnit.SECONDS)) {
            process.destroyForcibly()
            return -1
        }
    } catch (IOException ignored) {
        return -1
    }
    String version = process.inputStream.getText('UTF-8')
    def match = version =~ /version\s+"(\d+)(?:\.(\d+))?/
    if (!match.find()) return -1
    return match.group(1).toInteger() == 1 ? match.group(2).toInteger() : match.group(1).toInteger()
}

private void runBuildTools(File javaExecutable, File buildTools, File directory, boolean windows, String version) {
    List<String> command
    if (windows) {
        File bash = resolveWindowsBash()
        String bashCommand = [
                shellQuote(javaExecutable.absolutePath),
                '-jar',
                shellQuote(buildTools.absolutePath),
                '--rev',
                version,
                '--output-dir',
                shellQuote(directory.absolutePath)
        ].join(' ')
        command = [bash.absolutePath, '-lc', bashCommand]
    } else {
        command = [
                javaExecutable.absolutePath,
                '-jar',
                buildTools.absolutePath,
                '--rev',
                version,
                '--output-dir',
                directory.absolutePath
        ]
    }
    Process process = new ProcessBuilder(command).directory(directory).inheritIO().start()
    if (!process.waitFor(30, TimeUnit.MINUTES)) {
        process.destroyForcibly()
        throw new GradleException('BuildTools timed out after 30 minutes')
    }
    if (process.exitValue() != 0) {
        throw new GradleException("BuildTools failed with exit code ${process.exitValue()}")
    }
}

private File resolveWindowsBash() {
    Process where = new ProcessBuilder('where.exe', 'git.exe')
            .redirectErrorStream(true)
            .start()
    if (!where.waitFor(10, TimeUnit.SECONDS)) {
        where.destroyForcibly()
        throw new GradleException('Unable to locate Git bash.exe within 10 seconds')
    }
    String gitPath = where.inputStream.getText('UTF-8').readLines().find { !it.isBlank() }
    if (where.exitValue() != 0 || gitPath == null) {
        throw new GradleException('Git is required to run BuildTools on Windows')
    }
    File bash = new File(new File(gitPath.trim()).parentFile.parentFile, 'bin/bash.exe')
    if (!bash.isFile()) throw new GradleException('Git bash.exe is missing: ' + bash)
    return bash
}

private String shellQuote(String path) {
    return "'${path.replace('\\', '/').replace("'", "'\\''")}'"
}

private boolean isSpigot188(File jar) {
    return isSpigotVersion(jar, 'v1_8_R3')
}

private boolean isSpigotVersion(File jar, String version) {
    try {
        ZipFile zip = new ZipFile(jar)
        try {
            return zip.getEntry("org/bukkit/craftbukkit/${version}/CraftServer.class") != null
        } finally {
            zip.close()
        }
    } catch (IOException ignored) {
        return false
    }
}
